server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Реверс-прокси на services/api — оба контейнера на общей внешней сети dwh-net,
    # sgn-api резолвится по имени контейнера. Same-origin в проде — CORS фронтенду не нужен.
    location /api/ {
        proxy_pass http://sgn-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA-фоллбэк: неизвестные пути отдаём как index.html, чтобы клиентский роутинг
    # (react-router) сам разбирался с адресом.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
