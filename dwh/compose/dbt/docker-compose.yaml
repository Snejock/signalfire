services:
  sgn-dbt:
    build: .
    container_name: sgn-dbt
    env_file:
      - path: ../../../.env
        required: true
    restart: unless-stopped
    networks:
      - dwh-net
    ports:
      - '38082:8081'
    volumes:
      - ../../dbt:/usr/app/dbt/dwh
      - ./config/profiles.yml:/root/.dbt/profiles.yml
    working_dir: /usr/app/dbt/dwh
    stdin_open: true
    tty: true
    entrypoint: ['sleep', 'infinity']
    # Базовый образ dbt-core прописывает healthcheck 'dbt --version' (наследуется,
    # если не переопределить) с дефолтным interval=30s. Это не дёшево: сама команда
    # ~10с CPU (bootstrap CLI dbt — сканирование adapter-плагинов и т.п., не сеть),
    # то есть контейнер непрерывно жжёт ~25% ядра. Тут этот контейнер — просто
    # sleep-инфинити-цель для `docker exec sgn-dbt dbt run/compile ...` из Airflow
    # (см. dwh/airflow/dags/SYS/DBT_RUN.py, DBT_COMPILE.py), и ни один сервис не
    # зависит от его health-статуса — отключаем без потери функциональности.
    healthcheck:
      disable: true

networks:
  dwh-net:
    external: true
